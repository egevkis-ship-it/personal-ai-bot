# Local prototype: Postgres + FastAPI API (serves the PWA too).
# Start:  docker compose -f docker-compose.app.yml up --build
# Open:   http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fitness
    ports:
      - "5433:5432"          # host 5433 to avoid clashing with a local Postgres
    volumes:
      - fit_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: development                      # dev: no Telegram login required (auto dev user)
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db:5432/fitness
      REDIS_URL: redis://unused:6379/0          # not used by the API
      TELEGRAM_BOT_TOKEN: local                 # placeholders for local dev
      ANTHROPIC_API_KEY: local
      OPENAI_API_KEY: local
      DEV_UID: local                            # local dev data is scoped to this user
    ports:
      - "8000:8000"

volumes:
  fit_pgdata:
