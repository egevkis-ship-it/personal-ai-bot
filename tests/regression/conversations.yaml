# Регрессионные кейсы из реальных багов live-чата.
# Запускается test_no_db_smoke.py.

cases:

  - name: "Длинный план не уходит в task/finance/nutrition stub"
    bug: "Длинный план сообщение попадало в Модуль в разработке"
    input: |
      Запланируем на следующую неделю
      25-05-2026 — понедельник
      Жим штанги 90 кг × 10
    must_not_contain:
      - "Модуль в разработке"
      - "Модуль задач"
      - "Модуль финансов"
      - "Модуль питания"

  - name: "Удали тренировки не уходит в ops"
    bug: "Удали все мои тренировки вызывал codegen/миграции"
    input: "удали все мои тренировки"
    must_not_contain:
      - "миграцию"
      - "схема"
      - "git commit"
      - "Модуль в разработке"

  - name: "Копируй тренировки не уходит в ops"
    bug: "Копируй тренировки этой недели спрашивал про миграции"
    input: "копируй тренировки этой недели на следующую"
    must_not_contain:
      - "миграцию"
      - "разовая операция"
      - "Модуль в разработке"

  - name: "Дата отображается в человеческом формате"
    bug: "Тренировка на ISO-дату вместо человеческого формата"
    input: "покажи план на пятницу"
    must_not_contain_regex:
      - 'Тренировка на \d{4}-\d{2}-\d{2}:'

  - name: "Странный диапазон дат 1900-2999"
    bug: "Заголовок План 1900-01-01 до 2999-12-31"
    input: "покажи запланированные тренировки"
    must_not_contain:
      - "1900-01-01"
      - "2999-12-31"

  - name: "Погода не уходит в фитнес"
    bug: "Какая погода интерпретировалась как fitness"
    input: "Какая сегодня погода в Москве"
    must_not_contain:
      - "тренировк"
      - "упражнен"
      - "подход"
