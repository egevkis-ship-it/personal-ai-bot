# 3 базовых функции бота. Каждый сценарий — самодостаточный happy path.
# Запуск: .venv/bin/python scripts/telegram_smoke.py

scenarios:

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 1: ПЛАНИРОВАНИЕ
  # ═══════════════════════════════════════════════════

  - name: "1.1 Запланировать тренировку на завтра"
    steps:
      - send: "Запланируй на завтра грудь: жим лёжа 4×10 80кг, разводка гантелей 3×12 20кг, брусья 3×8"
        timeout_s: 60
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"
          - "NameError"
        must_contain:
          - "жим"   # любое упоминание упражнения = понял

  - name: "1.2 Показать план на завтра"
    steps:
      - send: "Что у меня по плану на завтра"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"
          - "NameError"

  - name: "1.3 Показать план на неделю"
    steps:
      - send: "Покажи план на неделю"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 2: ЗАПИСЬ ТРЕНИРОВКИ
  # ═══════════════════════════════════════════════════

  - name: "2.1 Старт сессии"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
        must_contain:
          - "сесси"
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"

  - name: "2.2 Запись одного подхода"
    steps:
      - send: "Жим штанги лёжа 80 на 5"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Изменил параметры упражнения"   # должно быть фактом, не правкой плана
          - "NameError"

  - name: "2.3 Запись нескольких подходов"
    steps:
      - send: "Жим лёжа 80×5, 80×5, 75×7"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Изменил параметры упражнения"

  - name: "2.4 Завершение тренировки"
    steps:
      - send: "Закончил тренировку"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "NameError"
          - "format_number"
          - "is not defined"

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 3: АРХИВ ТРЕНИРОВОК
  # ═══════════════════════════════════════════════════

  - name: "3.1 Что я делал сегодня"
    steps:
      - send: "Что я делал сегодня"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"
          - "кардио или силовая"   # бот спрашивает чушь — мискласс
          - "проанализировал"      # тоже мискласс

  - name: "3.2 Последняя тренировка"
    steps:
      - send: "Покажи последнюю тренировку"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"

  - name: "3.3 Тренировки за неделю"
    steps:
      - send: "Что я делал на этой неделе"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"
          - "кардио или силовая"
