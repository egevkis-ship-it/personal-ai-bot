# E2E сценарии для запуска через scripts/telegram_smoke.py
# (реальный Telegram, реальный бот).
#
# Только базовые сценарии — те которые ДОЛЖНЫ работать перед чем угодно.
# Добавлять новые — по одному, только когда базовые зелёные.

scenarios:

  - name: "1. /help отвечает"
    steps:
      - send: "/help"
        must_contain:
          - "тренировк"
        timeout_s: 15

  - name: "2. Показ плана на сегодня"
    steps:
      - send: "Что сегодня по плану"
        must_not_contain:
          - "Модуль в разработке"
          - "упал с ошибкой"
          - "NameError"
        timeout_s: 30

  - name: "3. Запись подхода создаёт тренировку"
    steps:
      - send: "Начинаю тренировку"
        must_contain:
          - "сесси"
        must_not_contain:
          - "упал с ошибкой"
        timeout_s: 30
      - send: "Жим лёжа 80 на 5"
        must_not_contain:
          - "упал с ошибкой"
          - "NameError"
          - "Изменил параметры"
        timeout_s: 30
      - send: "Закончил тренировку"
        must_not_contain:
          - "NameError"
          - "упал с ошибкой"
          - "format_number"
        timeout_s: 30
