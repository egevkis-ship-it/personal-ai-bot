# Жёсткий прогон. Реальные фразы, сленг, неочевидные последовательности.
# Каждое must_not_contain ловит "бот молча упал/мискласс/неправильный модуль".

scenarios:

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 1: ПЛАНИРОВАНИЕ — разные формулировки
  # ═══════════════════════════════════════════════════════════════

  - name: "1.1 Запланируй на завтра"
    steps:
      - send: "Запланируй на завтра грудь: жим лёжа 4×10 80кг, разводка 3×12 20кг"
        timeout_s: 60
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "1.2 Поставь тренировку на пятницу"
    steps:
      - send: "Поставь на пятницу ноги: присед 4×8 100кг, выпады 3×12"
        timeout_s: 60
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "1.3 В четверг сделаю руки"
    steps:
      - send: "В четверг руки: бицепс 4×10, трицепс 4×12"
        timeout_s: 60
        must_not_contain: ["упал с ошибкой"]

  - name: "1.4 На воскресенье отдых"
    steps:
      - send: "На воскресенье поставь отдых"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "1.5 Длинная программа на неделю"
    steps:
      - send: "Запланируй неделю: пн — грудь жим 4х10 80кг; ср — спина тяга 4х10 70кг; пт — ноги присед 4х8 100кг"
        timeout_s: 90
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "1.6 С явными датами"
    steps:
      - send: "Запланируй: 25.05 — грудь, 27.05 — спина, 29.05 — ноги"
        timeout_s: 60
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "1.7 Показать сегодня — разные формы"
    steps:
      - send: "Что сегодня"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]
      - send: "Что у меня в плане"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "План на сегодня"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Тренировка сегодня"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "1.8 Показать на конкретный день"
    steps:
      - send: "Что у меня в среду"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Покажи тренировку в субботу"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Что планировал на 25 мая"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "1.9 Завтра / послезавтра / через 2 дня"
    steps:
      - send: "Что у меня завтра"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Что послезавтра"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "1.10 План на следующую неделю"
    steps:
      - send: "Что на следующей неделе"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Покажи следующую неделю"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 2: РЕДАКТИРОВАНИЕ ПЛАНА — контекст и сленг
  # ═══════════════════════════════════════════════════════════════

  - name: "2.1 Замени упражнение"
    steps:
      - send: "Покажи тренировку на завтра"
        timeout_s: 30
      - send: "Замени жим на тягу"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "2.2 Поменяй — синоним замены"
    steps:
      - send: "Покажи план на завтра"
        timeout_s: 30
      - send: "Поменяй разводку на pec deck"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "2.3 Убери / удали упражнение"
    steps:
      - send: "Покажи план на завтра"
        timeout_s: 30
      - send: "Убери оттуда брусья"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "2.4 Добавь упражнение"
    steps:
      - send: "Покажи план на завтра"
        timeout_s: 30
      - send: "Добавь к ним планку 3×60 секунд"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "2.5 Перенеси на другой день"
    steps:
      - send: "Перенеси завтрашнюю тренировку на послезавтра"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "2.6 Контекст 'её / эту'"
    steps:
      - send: "Покажи тренировку на завтра"
        timeout_s: 30
      - send: "Давай её изменим"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Неясный запрос"]

  - name: "2.7 Изменение веса в упражнении"
    steps:
      - send: "Покажи план на завтра"
        timeout_s: 30
      - send: "Поставь жим на 90 кг"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "2.8 Изменение количества подходов"
    steps:
      - send: "Покажи план на завтра"
        timeout_s: 30
      - send: "Сделай жим 5 подходов вместо 4"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 3: ЗАПИСЬ ТРЕНИРОВКИ — разные формы и сленг
  # ═══════════════════════════════════════════════════════════════

  - name: "3.1 Канонический старт"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
        must_contain: ["сесси"]

  - name: "3.2 Сленг — приступаю"
    steps:
      - send: "Приступаю к тренировке"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "3.3 Запись подхода — 'на'"
    steps:
      - send: "Жим штанги 80 на 5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Изменил параметры"]

  - name: "3.4 Запись подхода — 'x'"
    steps:
      - send: "Жим 80x5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "3.5 Запись подхода — '×' (юникод)"
    steps:
      - send: "Жим 80×5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "3.6 Запись через 'кг' и 'повторений'"
    steps:
      - send: "Жим штанги 80 килограмм 5 повторений"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "3.7 'Сделал' + параметры"
    steps:
      - send: "Сделал жим лёжа 80 на 5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Изменил параметры"]

  - name: "3.8 'Жал' / 'тянул' — глаголы"
    steps:
      - send: "Жал штангу 80 на 5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Изменил параметры"]

  - name: "3.9 Несколько подходов одним сообщением"
    steps:
      - send: "Жим 80×5, 80×5, 75×7, 70×8"
        timeout_s: 45
        must_not_contain: ["упал с ошибкой"]

  - name: "3.10 Сленг — без четкой структуры"
    steps:
      - send: "Жимнул сотку трижды по 5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "3.11 Подтягивания без веса"
    steps:
      - send: "Подтягивания 10 раз"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "3.12 Брусья — bodyweight"
    steps:
      - send: "Брусья 3 подхода по 8 раз"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "3.13 Завершение тренировки"
    steps:
      - send: "Закончил тренировку"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "NameError", "format_number"]

  - name: "3.14 Альтернативное завершение"
    steps:
      - send: "Всё, тренировка закончена"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "3.15 Сленг завершения"
    steps:
      - send: "Финиш, я закончил"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 4: ПОЛНЫЙ FLOW — запись с нуля до конца
  # ═══════════════════════════════════════════════════════════════

  - name: "4.1 Старт → 3 упражнения → финиш"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
      - send: "Жим лёжа 80 на 5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Жим гантелей 25 на 12"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Брусья 3 по 10"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Закончил"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "NameError"]

  - name: "4.2 Откат — удали последний подход"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
      - send: "Жим 80 на 5"
        timeout_s: 30
      - send: "Удали последний подход"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 5: АРХИВ — разные запросы
  # ═══════════════════════════════════════════════════════════════

  - name: "5.1 Что я делал сегодня"
    steps:
      - send: "Что я делал сегодня"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "кардио или силовая"]

  - name: "5.2 Что вчера"
    steps:
      - send: "Что я делал вчера"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "5.3 Последняя тренировка"
    steps:
      - send: "Покажи последнюю тренировку"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "ImportError"]

  - name: "5.4 За неделю"
    steps:
      - send: "Что я делал на этой неделе"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "5.5 За месяц"
    steps:
      - send: "Что я делал в этом месяце"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "5.6 Архивные / история"
    steps:
      - send: "Покажи архив тренировок"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "кардио или силовая"]
      - send: "История тренировок"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "5.7 Все мои тренировки"
    steps:
      - send: "Все мои тренировки"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "проанализировал"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 6: ПРОГРЕСС, РЕКОРДЫ, СТАТИСТИКА
  # ═══════════════════════════════════════════════════════════════

  - name: "6.1 Мои рекорды"
    steps:
      - send: "Мои рекорды"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "6.2 ПР по жиму"
    steps:
      - send: "Какой у меня ПР по жиму"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "6.3 Максимум по приседу"
    steps:
      - send: "Сколько я максимум приседал"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "6.4 Прогресс"
    steps:
      - send: "Покажи прогресс"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "6.5 Сводка / статистика"
    steps:
      - send: "Сводка"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]
      - send: "Статистика"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 7: ЗАМЕРЫ ТЕЛА
  # ═══════════════════════════════════════════════════════════════

  - name: "7.1 Записать вес"
    steps:
      - send: "Вес 80.5 кг"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "7.2 Несколько замеров одним"
    steps:
      - send: "Талия 82, бицепс 38, % жира 15"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "7.3 Сегодня 80"
    steps:
      - send: "Сегодня взвесился 80 кг"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 8: ТРАВМЫ И ОГРАНИЧЕНИЯ
  # ═══════════════════════════════════════════════════════════════

  - name: "8.1 Болит плечо"
    steps:
      - send: "У меня болит плечо"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "8.2 Травма колена"
    steps:
      - send: "Травма колена, не делать ноги"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "8.3 Боль с оценкой"
    steps:
      - send: "Плечо болит на 4 из 10"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 9: НАПОМИНАНИЯ
  # ═══════════════════════════════════════════════════════════════

  - name: "9.1 Напомни в 7 утра"
    steps:
      - send: "Напомни в 7 утра про тренировку"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "9.2 Каждый день в 8"
    steps:
      - send: "Напоминай каждый день в 8 утра"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 10: РОУТИНГ — НЕ путать команды
  # ═══════════════════════════════════════════════════════════════

  - name: "10.1 'Удали тренировки' → НЕ в ops"
    steps:
      - send: "Удали все мои тренировки"
        timeout_s: 30
        must_not_contain: ["миграц", "git commit", "схем", "Модуль в разработке"]

  - name: "10.2 'Копируй неделю' → НЕ в ops"
    steps:
      - send: "Скопируй неделю на следующую"
        timeout_s: 30
        must_not_contain: ["миграц", "разовая операция", "git commit"]

  - name: "10.3 'Очисти историю' → НЕ в ops"
    steps:
      - send: "Очисти историю тренировок"
        timeout_s: 30
        must_not_contain: ["миграц", "git commit"]

  - name: "10.4 'Перенеси план' → fitness"
    steps:
      - send: "Перенеси план на завтра"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "миграц"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 11: НЕ-ФИТНЕС ВОПРОСЫ
  # ═══════════════════════════════════════════════════════════════

  - name: "11.1 Погода"
    steps:
      - send: "Какая погода в Москве"
        timeout_s: 30
        must_not_contain: ["тренировк", "упражнен", "упал с ошибкой"]

  - name: "11.2 Привет"
    steps:
      - send: "Привет"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "11.3 Что приготовить на ужин"
    steps:
      - send: "Что приготовить на ужин"
        timeout_s: 30
        must_not_contain: ["тренировк", "упал с ошибкой"]

  - name: "11.4 Перевод слова"
    steps:
      - send: "Переведи 'bench press'"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 12: EDGE CASES — необычные сообщения
  # ═══════════════════════════════════════════════════════════════

  - name: "12.1 Просто число"
    steps:
      - send: "80"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Traceback"]

  - name: "12.2 Эмодзи"
    steps:
      - send: "💪"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Traceback"]

  - name: "12.3 Только название упражнения"
    steps:
      - send: "жим"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Traceback"]

  - name: "12.4 С опечаткой"
    steps:
      - send: "Запланеруй на завтра жим"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "12.5 Voice-like с филлерами"
    steps:
      - send: "Так это, короче, делал жим, ну вот, 80 кило 5 раз"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Модуль в разработке"]

  - name: "12.6 Микс кириллицы и латиницы"
    steps:
      - send: "Bench press 80kg x 5"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "12.7 Голосовая ошибка распознавания"
    steps:
      - send: "Сделал жинт штанги ляжа 80 кг 5 пов торений"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 13: CHAOS — последовательности с разрывами контекста
  # ═══════════════════════════════════════════════════════════════

  - name: "13.1 Запись без старта"
    steps:
      - send: "Жим лёжа 100 на 3"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "Изменил параметры"]

  - name: "13.2 Финиш без старта"
    steps:
      - send: "Закончил тренировку"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой", "NameError"]

  - name: "13.3 Удаление без подтверждения"
    steps:
      - send: "Удали все тренировки"
        timeout_s: 30
        must_not_contain: ["миграц"]
      - send: "Нет, не надо"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "13.4 Старт → запись → старт ещё раз"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
      - send: "Жим 80 на 5"
        timeout_s: 30
      - send: "Начинаю тренировку"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  - name: "13.5 Запись → удаление сессии → новая запись"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
      - send: "Жим 80 на 5"
        timeout_s: 30
      - send: "Удали последний подход"
        timeout_s: 30
      - send: "Жим 85 на 3"
        timeout_s: 30
        must_not_contain: ["упал с ошибкой"]

  # ═══════════════════════════════════════════════════════════════
  # БЛОК 14: КОМАНДЫ (slash)
