# Реальные баги из тестов в Telegram. Каждый сценарий — конкретный случай
# который ты тестировал ранее. Проверяем починилось ли.

scenarios:

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 1: ПЛАНИРОВАНИЕ
  # ═══════════════════════════════════════════════════

  - name: "1.1 Запланировать на завтра"
    steps:
      - send: "Запланируй на завтра грудь: жим лёжа 4×10 80кг, разводка гантелей 3×12 20кг, брусья 3×8"
        timeout_s: 60
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"

  - name: "1.2 Показать план на сегодня"
    steps:
      - send: "Покажи тренировку на сегодня"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"

  - name: "1.3 Показать на пятницу (любой день недели)"
    steps:
      - send: "Покажи тренировку в пятницу"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"

  - name: "1.4 План на неделю"
    steps:
      - send: "Покажи план на неделю"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"

  - name: "1.5 БАГ: контекст последней показанной тренировки"
    description: "После показа пятницы, давай её изменим. Раньше говорил 'неясный запрос'"
    steps:
      - send: "Покажи тренировку на сегодня"
        timeout_s: 30
      - send: "Давай ее изменим"
        timeout_s: 30
        must_not_contain:
          - "Неясный запрос"
          - "упал с ошибкой"

  - name: "1.6 БАГ: импорт длинного плана не идёт в ops"
    description: "Раньше большие планы попадали в task/finance/Модуль в разработке"
    steps:
      - send: "Запланируй на следующую неделю: понедельник грудь жим 4х10 80кг, среда спина тяга 4х10 70кг, пятница ноги присед 4х10 100кг"
        timeout_s: 60
        must_not_contain:
          - "Модуль в разработке"
          - "упал с ошибкой"
          - "миграц"
          - "git commit"

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 2: ЗАПИСЬ ТРЕНИРОВКИ
  # ═══════════════════════════════════════════════════

  - name: "2.1 Старт сессии"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
        must_contain:
          - "сесси"
        must_not_contain:
          - "упал с ошибкой"

  - name: "2.2 БАГ: 'сделал X кг Y раз' — это запись, НЕ правка плана"
    description: "Раньше парсилось как update target_sets=1 в плане"
    steps:
      - send: "Сделал пуловер с канатами 25 кг 12 повторений"
        timeout_s: 30
        must_not_contain:
          - "Изменил параметры упражнения"
          - "упал с ошибкой"

  - name: "2.3 БАГ: 'я делаю тренировку' — не ломает сессию"
    description: "Раньше говорил 'Активной сессии нет'"
    steps:
      - send: "Начинаю тренировку"
        timeout_s: 30
      - send: "Я делаю тренировку, мы ничего не меняем"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "кардио или силовая"

  - name: "2.4 Запись подхода в сессии"
    steps:
      - send: "Жим штанги лёжа 80 на 5"
        timeout_s: 30
        must_not_contain:
          - "Изменил параметры"
          - "упал с ошибкой"
          - "NameError"

  - name: "2.5 Несколько подходов одним сообщением"
    steps:
      - send: "Жим лёжа 80×5, 80×5, 75×7"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"

  - name: "2.6 БАГ: завершение тренировки (NameError format_number)"
    description: "Раньше падал на закончил тренировку"
    steps:
      - send: "Закончил тренировку"
        timeout_s: 30
        must_not_contain:
          - "NameError"
          - "format_number"
          - "is not defined"
          - "упал с ошибкой"

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 3: АРХИВ
  # ═══════════════════════════════════════════════════

  - name: "3.1 Что я делал сегодня"
    steps:
      - send: "Что я делал сегодня"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"
          - "кардио или силовая"

  - name: "3.2 Последняя тренировка"
    steps:
      - send: "Покажи последнюю тренировку"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "ImportError"
          - "command_last_workout"

  - name: "3.3 БАГ: 'покажи архивные тренировки' — не уходит в general AI"
    description: "Раньше бот спрашивал 'кардио или йога?'"
    steps:
      - send: "Покажи архивные тренировки"
        timeout_s: 30
        must_not_contain:
          - "кардио или"
          - "проанализировал"
          - "систематизировать"
          - "упал с ошибкой"

  - name: "3.4 БАГ: 'все тренировки которые я сделал' — не general AI"
    description: "Раньше бот предлагал составить план"
    steps:
      - send: "Все тренировки которые я сделал"
        timeout_s: 30
        must_not_contain:
          - "кардио или"
          - "проанализировал"
          - "систематизировать"
          - "упал с ошибкой"

  - name: "3.5 За эту неделю"
    steps:
      - send: "Что я делал на этой неделе"
        timeout_s: 30
        must_not_contain:
          - "упал с ошибкой"
          - "Модуль в разработке"

  # ═══════════════════════════════════════════════════
  # ФУНКЦИЯ 4: РОУТИНГ (не путать команды)
  # ═══════════════════════════════════════════════════

  - name: "4.1 БАГ: 'удали тренировки' НЕ идёт в ops (миграции)"
    description: "Раньше бот начинал писать SQL миграции"
    steps:
      - send: "Удали все мои тренировки"
        timeout_s: 30
        must_not_contain:
          - "миграц"
          - "git commit"
          - "схем"
          - "Модуль в разработке"

  - name: "4.2 БАГ: 'копируй тренировки' НЕ идёт в ops"
    description: "Раньше бот спрашивал про разовую операцию SQL"
    steps:
      - send: "Копируй тренировки этой недели на следующую"
        timeout_s: 30
        must_not_contain:
          - "миграц"
          - "разовая операция"
          - "Модуль в разработке"

  - name: "4.3 Не-фитнес уходит в general AI"
    steps:
      - send: "Какая погода в Москве"
        timeout_s: 30
        must_not_contain:
          - "тренировк"
          - "упражнен"
          - "упал с ошибкой"
