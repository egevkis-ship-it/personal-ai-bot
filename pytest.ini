[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers
markers =
    unit: pure unit tests (no DB, no network)
    db: requires PostgreSQL
    regression: replay real conversations (mock LLM)
    slow: takes >1s
